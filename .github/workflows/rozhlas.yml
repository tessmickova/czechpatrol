name: Rozhlas do kanálů

on:
  push:
    branches: [main]
    paths:
      - "data/incidenty.json"
      - "data/historie.json"
  schedule:
    # Přehled dne dvakrát: ráno v 5:00 UTC (7:00 letního / 6:00 zimního
    # času) a večer v 17:00 UTC (19:00 / 18:00). Jeden večerní přehled
    # nestačil — kdo se ráno ptá „co se přes noc stalo", dostal odpověď
    # až v sedm večer.
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Poslat testovací zprávu"
        type: boolean
        default: false
      komu:
        # Zkouška nastavení nemá chodit odběratelům. Výchozí je proto
        # soukromá zpráva správci — tou se navíc ověří přesně ta cesta,
        # kterou se hlásí výpadek sběru.
        description: "Komu testovací zprávu"
        type: choice
        options: ["spravci soukrome", "do verejneho kanalu"]
        default: "spravci soukrome"
      prehled:
        # Přehled dne mimo rozvrh — když je potřeba říct, co se děje, hned.
        description: "Poslat přehled dne teď (místo okamžitých zpráv)"
        type: boolean
        default: false
      mimoradne:
        # Výjimka z pravidla „do kanálu jen ověřené": správce vědomě pošle
        # jeden zveřejněný záznam hned. Stav hlídá, aby odešel jen jednou.
        description: "Mimořádná zpráva: slug zveřejněného záznamu (jinak prázdné)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: rozhlas
  cancel-in-progress: false

jobs:
  rozhlas:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_KANAL: ${{ vars.TELEGRAM_KANAL || '@czechpatrol' }}
      SPRAVCE_CHAT: ${{ vars.SPRAVCE_CHAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Volba jde přes proměnnou prostředí, ne do textu příkazu. Je to sice
      # výběr z pevného seznamu, ale pravidlo platí pro všechny vstupy zvenčí
      # stejně — jinak se u příštího vstupu zapomene.
      - name: Testovací zpráva
        if: github.event_name == 'workflow_dispatch' && inputs.test
        env:
          KOMU: ${{ inputs.komu }}
        run: |
          if [ "$KOMU" = "do verejneho kanalu" ]; then
            node nastroje/rozhlas.mjs --test
          else
            node nastroje/rozhlas.mjs --test --test-spravce
          fi

      - name: Mimořádná zpráva
        if: github.event_name == 'workflow_dispatch' && inputs.mimoradne != ''
        env:
          SLUG: ${{ inputs.mimoradne }}
        run: |
          # Slug přichází zvenčí — kontroluje se tvar, a do příkazu jde jen proměnná.
          if ! printf '%s' "$SLUG" | grep -Eq '^[a-z0-9-]{3,120}$'; then
            echo "Neplatný slug."; exit 1
          fi
          node nastroje/rozhlas.mjs --mimoradne "$SLUG"

      - name: Okamžité zprávy (vážné případy, opatření, změny oficiálních stavů)
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && (inputs.prehled || inputs.mimoradne != ''))
        run: node nastroje/rozhlas.mjs --okamzite

      - name: Přehled dne
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.prehled)
        run: node nastroje/rozhlas.mjs --souhrn

      - name: Uložit stav odeslaného
        run: |
          if [ -z "$(git status --porcelain data/fronta/rozhlaseno.json)" ]; then
            echo "Stav se nezměnil."
            exit 0
          fi
          git config user.name "rozhlas"
          git config user.email "rozhlas@users.noreply.github.com"
          git add data/fronta/rozhlaseno.json
          git commit -m "Rozhlas: stav odeslaných zpráv $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git push && break
            echo "Push selhal, opakuji za $((2**i)) s"
            sleep $((2**i))
            git pull --rebase
          done
