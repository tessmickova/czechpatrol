name: Rozhodnutí o návrhu

# Co to dělá
# ----------
# Provede lidské rozhodnutí o jednom návrhu z fronty: schválí ho (záznam jde
# na web) nebo zamítne (zůstane po něm stopa).
#
# Proč přes workflow a ne přímo z webu: rozhodnutí je změna v repozitáři a má
# mít commit, autora a historii. Web (stránka Správa) sem jen pošle pokyn,
# vlastní práci dělá `npm run spravce`, tedy tentýž kód jako z příkazové řádky.
# Dvě cesty ke schválení, jedno chování.

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Id návrhu"
        required: true
      akce:
        description: "Co s ním"
        required: true
        type: choice
        options: [schval, znovu, zamitni]
        default: schval
      duvod:
        description: "Důvod zamítnutí nebo toho, co má ověřovatel doplnit"
        required: false
        default: ""
      upravy:
        description: "JSON se změnami, které správce udělal před schválením"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Dvě rozhodnutí naráz by si přepsala data/navrhy.json.
  group: rozhodnuti
  cancel-in-progress: false

jobs:
  rozhodnout:
    runs-on: ubuntu-latest
    outputs:
      zmena: ${{ steps.zapis.outputs.zmena }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Balíčky z mezipaměti
        id: moduly
        uses: actions/cache@v6
        with:
          path: node_modules
          key: moduly-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - if: steps.moduly.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false

      # Vstupy jdou přes proměnné prostředí, ne do textu příkazu. Vložené
      # přímo by z nich šlo vypsat cokoli dalšího a spustit to na běžci.
      # Úpravy se zapíšou před rozhodnutím, aby se schvaloval už opravený
      # text. Opačné pořadí by znamenalo zveřejnit strojovou verzi a opravovat
      # ji až potom — tedy na webu a v kanálu by chvíli stála ta nepřesná.
      - name: Zapsat úpravy správce
        if: inputs.upravy != ''
        env:
          NAVRH: ${{ inputs.id }}
          UPRAVY: ${{ inputs.upravy }}
        run: npm run spravce -- uprav "$NAVRH" "$UPRAVY"

      - name: Provést rozhodnutí
        env:
          AKCE: ${{ inputs.akce }}
          NAVRH: ${{ inputs.id }}
          DUVOD: ${{ inputs.duvod }}
        run: |
          case "$AKCE" in
            schval|znovu|zamitni) ;;
            *) echo "Neznámá akce: $AKCE"; exit 1 ;;
          esac
          npm run spravce -- "$AKCE" "$NAVRH" "$DUVOD"

      # Schválený záznam jde na web. Když neprojde kontrolou, nemá tam co dělat
      # a běh musí spadnout dřív, než se to commitne.
      - name: Kontrola dat a testy
        run: |
          npm run kontrola:data
          npm test

      - name: Zapsat rozhodnutí
        id: zapis
        env:
          AKCE: ${{ inputs.akce }}
          NAVRH: ${{ inputs.id }}
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Nic se nezměnilo — návrh už zřejmě rozhodnutý byl."
            exit 0
          fi
          git config user.name "sprava"
          git config user.email "sprava@users.noreply.github.com"
          git add data/
          git commit -m "Návrh $NAVRH: $AKCE"
          for i in 1 2 3 4; do
            git push && break
            sleep $((2**i))
            git pull --rebase
          done
          echo "zmena=true" >> "$GITHUB_OUTPUT"

      # Vrácené návrhy musí dojít i k ověřovateli, jinak se u nich jen objeví
      # poznámka a nikdo s nimi nic neudělá.
      - name: Poslat k doplnění ověřovateli
        if: inputs.akce == 'znovu'
        env:
          NAVRH: ${{ inputs.id }}
          DUVOD: ${{ inputs.duvod }}
        run: |
          set -u
          git fetch origin patrol/overovani
          git checkout -q -B patrol-vetev origin/patrol/overovani
          NAVRH="$NAVRH" DUVOD="$DUVOD" node --input-type=module -e '
            import fs from "node:fs";
            const cesta = "data/fronta/pro-patrola.json";
            fs.mkdirSync("data/fronta", { recursive: true });
            let fronta = [];
            try { fronta = JSON.parse(fs.readFileSync(cesta, "utf-8")); } catch {}
            if (!Array.isArray(fronta)) fronta = [];
            const duvod = (process.env.DUVOD ?? "").trim();
            fronta.push({
              id: `z-${Date.now().toString(36)}`,
              zadano: new Date().toISOString(),
              zadal: "sprava",
              stav: "ceka",
              tykaSe: process.env.NAVRH,
              zadani: `Doplň návrh ${process.env.NAVRH}. ${duvod || "Správce ho vrátil k dalšímu ověření."}`,
            });
            fs.writeFileSync(cesta, `${JSON.stringify(fronta, null, 2)}\n`);
          '
          git config user.name "sprava"
          git config user.email "sprava@users.noreply.github.com"
          git add data/fronta/pro-patrola.json
          git commit -m "Návrh $NAVRH vrácen k doplnění"
          for i in 1 2 3 4; do
            git push origin HEAD:patrol/overovani && break
            sleep $((2**i))
            git pull --rebase origin patrol/overovani
          done
          git checkout -q main

      # Rozeslání musí proběhnout tady, ne v rozhlas.yml.
      #
      # Rozhlas se spouští změnou data/incidenty.json na main — jenže tenhle
      # commit dělá workflow, a GitHub záměrně nespouští workflow z pushů,
      # které udělal jiný workflow (ochrana proti smyčce). Schválený záznam
      # se tak dostal na web, ale do kanálu už nic nepřišlo a nebylo poznat
      # proč. Totéž platí pro nasazení.
      - name: Rozeslat do kanálů
        if: inputs.akce == 'schval' && steps.zapis.outputs.zmena == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL: ${{ vars.TELEGRAM_KANAL || '@czechpatrol' }}
          SPRAVCE_CHAT: ${{ vars.SPRAVCE_CHAT }}
        run: node nastroje/rozhlas.mjs --okamzite


  # Nasazení se volá přímo, ne přes push. Commit z workflow žádný další
  # workflow nespustí, takže by schválený záznam zůstal v repozitáři
  # a na web by se dostal až s nejbližší jinou změnou.
  nasadit:
    needs: rozhodnout
    if: needs.rozhodnout.outputs.zmena == 'true'
    uses: ./.github/workflows/nasazeni.yml
    secrets: inherit
