name: Kontrola

on:
  push:
    # Větev externího ověřovatele se schválně vynechává. Nese frontu kandidátů
    # ještě nesrovnanou s jeho návrhy, takže test „nesplétají se se zachycenými
    # zprávami" tam padá při každém jeho pushi a jen pálí minuty. Jeho data
    # prochází touž kontrolou v „Převzít práci od Patrola" — až po srovnání
    # fronty; změny kódu z té větve jdou přes pull request, a ten se tu
    # kontroluje dál.
    branches: ["**", "!patrol/overovani"]
  pull_request:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # Hotové node_modules z mezipaměti — viz sber.yml. V soukromém
      # repozitáři se běh účtuje zaokrouhlený nahoru na celou minutu,
      # takže ušetřená půlminuta je ušetřená minuta.
      - name: Balíčky z mezipaměti
        id: moduly
        uses: actions/cache@v6
        with:
          path: node_modules
          key: moduly-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - if: steps.moduly.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false
      - name: Kontrola dat
        run: npm run kontrola:data
      - name: Testy
        run: npm test
      - name: Kontrola typů
        run: npm run typecheck
      - name: Sestavení produkčního webu
        run: npm run build
      - name: Sestavení klikacího náhledu
        run: npm run nahled
      - name: API — závislosti
        run: npm ci --prefix api
      - name: API — testy a typy
        run: npm run test:api && npm run typecheck:api
