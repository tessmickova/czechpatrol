name: Kontrola

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Testy
        run: npm test
      - name: Kontrola typů
        run: npm run typecheck
      - name: Sestavení produkčního webu
        run: npm run build
      - name: Sestavení klikacího náhledu
        run: npm run nahled
