name: Kontrola

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Hotové node_modules z mezipaměti — viz sber.yml. V soukromém
      # repozitáři se běh účtuje zaokrouhlený nahoru na celou minutu,
      # takže ušetřená půlminuta je ušetřená minuta.
      - name: Balíčky z mezipaměti
        id: moduly
        uses: actions/cache@v4
        with:
          path: node_modules
          key: moduly-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.moduly.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false
      - name: Kontrola dat
        run: npm run kontrola:data
      - name: Testy
        run: npm test
      - name: Kontrola typů
        run: npm run typecheck
      - name: Sestavení produkčního webu
        run: npm run build
      - name: Sestavení klikacího náhledu
        run: npm run nahled
      - name: API — závislosti
        run: npm ci --prefix api
      - name: API — testy a typy
        run: npm run test:api && npm run typecheck:api
