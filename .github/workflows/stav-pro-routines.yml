name: Stav pro routines

# Proč tenhle workflow existuje
# -----------------------------
# Plánované routine běží v sandboxu za agentní proxy, která blokuje doménu
# czechpatrol.pages.dev, a GitHub API má dostupné jen po ručním přidělení
# přístupu, o které si sama neumí říct. Nemohla proto ověřit, jestli na
# doméně běží to, co je v repozitáři, ani jak dopadly poslední běhy.
#
# GitHub Actions žádné z těch omezení nemá. Zjistí obojí tady a zapíše to
# do repozitáře jako obyčejné soubory; routine je pak jen přečte z gitu
# a nepotřebuje k tomu síť ani API.
#
# Commit se dělá výchozím tokenem, který další workflow nespouští — jinak
# by se to zacyklilo s Nasazením.

on:
  workflow_run:
    workflows: ["Nasazení"]
    types: [completed]
  schedule:
    # Dvakrát denně, aby soubor nezestaral, i když se zrovna nenasazuje.
    - cron: "40 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stav-pro-routines
  cancel-in-progress: false

jobs:
  zapsat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Celá historie: bez ní nejde spočítat, o kolik je repozitář napřed
          # proti tomu, co je nasazené, ani co se mezitím změnilo.
          fetch-depth: 0

      - name: Zjistit stav živého webu
        env:
          ADRESA: https://czechpatrol.pages.dev
        run: |
          set -u
          mkdir -p data/fronta
          # Nasazení na Cloudflare chvíli trvá, než se rozejde.
          sleep 20
          KOD=$(curl -s -o /tmp/stav.json -w "%{http_code}" --max-time 25 "$ADRESA/stav.json" || echo 000)
          ZIVY=$(jq -r '.commit // empty' /tmp/stav.json 2>/dev/null || true)
          GENEROVANO=$(jq -r '.generovano // empty' /tmp/stav.json 2>/dev/null || true)
          REPO=$(git rev-parse HEAD)
          HTML=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$ADRESA/" || echo 000)
          if [ "$ZIVY" = "$REPO" ]; then SHODA=true; else SHODA=false; fi

          # Commity od botů (sběr, rozhlas, tenhle workflow) se dělají výchozím
          # tokenem, a ten nasazení nespouští. Repozitář je proto běžně o pár
          # commitů napřed, aniž by to znamenalo problém. Skutečně vadí až
          # rozdíl v tom, co se na web publikuje — proto se vedle holé shody
          # počítá i to, o kolik a v čem je repozitář napřed.
          POZADU=0
          ROZDIL=false
          if [ -n "$ZIVY" ] && git cat-file -e "$ZIVY^{commit}" 2>/dev/null; then
            POZADU=$(git rev-list --count "$ZIVY..HEAD")
            if git diff --name-only "$ZIVY" HEAD | grep -vE '^data/fronta/' | grep -q .; then
              ROZDIL=true
            fi
          fi

          jq -n \
            --arg kdy "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg adresa "$ADRESA" \
            --arg kodStav "$KOD" --arg kodHtml "$HTML" \
            --arg zivy "$ZIVY" --arg repo "$REPO" --arg gen "$GENEROVANO" \
            --argjson shoda "$SHODA" \
            --argjson pozadu "${POZADU:-0}" \
            --argjson rozdil "$ROZDIL" '{
              kontrolovano: $kdy,
              adresa: $adresa,
              dostupny: ($kodHtml == "200"),
              httpUvodni: ($kodHtml | tonumber? // 0),
              httpStavJson: ($kodStav | tonumber? // 0),
              zivyCommit: (if $zivy == "" then null else $zivy end),
              zivyGenerovano: (if $gen == "" then null else $gen end),
              repoCommit: $repo,
              shodujeSe: $shoda,
              commituNavic: $pozadu,
              rozdilVObsahu: $rozdil,
              poznamka: (if $shoda then
                  "Na webu běží přesně to, co je v repozitáři."
                elif ($rozdil | not) then
                  "Repozitář je napřed jen o zápisy stavu (data/fronta), které se na web nepublikují. Není to rozpor."
                else
                  "Repozitář je napřed o obsah, který ještě není nasazený. Nejbližší nasazení to srovná; ručně nenasazovat."
                end),
              vysvetleni: "Zapsáno workflow Stav pro routines. Routine tenhle soubor jen čte; na doménu sama nedosáhne. Za rozpor považuj jen rozdilVObsahu: true, který trvá i v dalším běhu."
            }' > data/fronta/zivy-web.json
          cat data/fronta/zivy-web.json

      - name: Zapsat historii posledních běhů
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
            --jq '{
              kontrolovano: (now | todate),
              poznamka: "Zapsáno workflow Stav pro routines místo volání api.github.com, na které routine nedosáhne.",
              behy: [.workflow_runs[] | {
                workflow: .name,
                zaver: (.conclusion // .status),
                sha: (.head_sha[0:7]),
                kdy: .created_at,
                cislo: .run_number,
                url: .html_url
              }]
            }' > data/fronta/behy.json
          jq '.behy | length' data/fronta/behy.json

      - name: Commit, když se něco změnilo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fronta/zivy-web.json data/fronta/behy.json
          if git diff --cached --quiet; then
            echo "Beze změny."
            exit 0
          fi
          git commit -m "Stav pro routines: živý web a historie běhů $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Mezitím mohl na main přibýt commit z jiného workflow (rozhlas zapisuje
          # stav odeslaných zpráv) a GitHub občas odpoví chybou 500. Obojí je
          # přechodné: přebasovat na aktuální main a zkusit znovu.
          for pokus in 1 2 3 4 5; do
            if git push; then
              echo "Odesláno na pokus $pokus."
              exit 0
            fi
            echo "Push selhal (pokus $pokus), zkusím znovu."
            sleep $((pokus * 5))
            git fetch origin main || true
            git rebase origin/main || { git rebase --abort || true; }
          done
          echo "::error::Stav pro routines se nepodařilo zapsat ani na pátý pokus."
          exit 1
