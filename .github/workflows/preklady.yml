name: Překlady rozhraní

# Proč zvlášť od nasazení: překlad stojí peníze a klíč. Vytěžení vět je levné
# a deterministické, takže běží i v kontrole; doplnění chybějících překladů
# se spouští ručně nebo jednou denně, a commituje jen když se něco změnilo.

on:
  workflow_dispatch:
  schedule:
    # Jednou denně; nové věty v rozhraní tak nezůstanou dlouho česky.
    - cron: "20 3 * * *"

permissions:
  contents: write

concurrency:
  group: preklady
  cancel-in-progress: false

jobs:
  preloz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Hotové node_modules z mezipaměti — viz sber.yml. V soukromém
      # repozitáři se běh účtuje zaokrouhlený nahoru na celou minutu,
      # takže ušetřená půlminuta je ušetřená minuta.
      - name: Balíčky z mezipaměti
        id: moduly
        uses: actions/cache@v6
        with:
          path: node_modules
          key: moduly-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - if: steps.moduly.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false

      - name: Vytěžit věty z kódu
        run: node nastroje/vytez-preklady.mjs --zapis

      # Strojový překlad je vypnutý: klíč k modelu se sem nepředává, protože
      # kredit došel a projekt na placené volání nemá. Nepřeložená věta se
      # zobrazí česky — web tím nespadne, jen v cizojazyčné verzi zůstane
      # kus češtiny. To je přijatelné; tichý výdaj by nebyl.
      - name: Doplnit chybějící překlady
        run: echo "::warning::Strojový překlad je vypnutý — nepřeložené věty zůstanou česky."

      # Neúplný překlad nesmí shodit build: chybějící věta se zobrazí česky.
      - name: Kontroly
        run: |
          npm run kontrola:data
          npm test
          npm run build

      - name: Commit, když přibyly překlady
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preklady/
          if git diff --cached --quiet; then
            echo "Beze změny."
            exit 0
          fi
          git commit -m "Překlady rozhraní $(date -u +'%Y-%m-%d %H:%M UTC')"
          for pokus in 1 2 3 4 5; do
            git push && exit 0
            sleep $((pokus * 5))
            git fetch origin main || true
            git rebase origin/main || { git rebase --abort || true; }
          done
          echo "::error::Překlady se nepodařilo odeslat."
          exit 1
