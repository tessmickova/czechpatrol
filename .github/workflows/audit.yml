name: Denní audit fronty

# Co to dělá
# ----------
# Projde zachycené kandidáty, nechá je posoudit modelem a z toho, co je
# opravdu nová událost, připraví návrh záznamu. Nezveřejňuje: návrh čeká
# v data/navrhy.json na člověka (`npm run spravce navrhy`).
#
# Nahrazuje denní rutiny, které tuhle práci měly dělat, ale nikdy nefungovaly —
# běžely v prostředí bez přístupu k repozitáři. Tady přístup je, klíč taky.
#
# Když model chybí nebo selže, přijde hláška správci na Telegram. Ověřovací
# vrstva je důležitá součást a její tiché vypnutí je porucha, ne klid.

on:
  # POZASTAVENO 19. 9. 2026 — denní běh je vypnutý.
  #
  # Proč: frontu 300 kandidátů právě prochází externí agent Patrol. Kdyby
  # audit běžel dál, oba by si šli po týchž zprávách a dělali dvojí práci.
  #
  # Zpátky se zapne odkomentováním `schedule` níže, až bude fronta pročištěná.
  # Pak má audit hlídat jen nové přírůstky.
  #
  # Ruční spuštění (workflow_dispatch) funguje pořád — vypnutý je jen kalendář.
  #
  # schedule:
  #   # Ráno, ať jsou návrhy připravené na začátek dne.
  #   - cron: "35 5 * * *"
  workflow_dispatch:
    inputs:
      dni:
        description: "Jak staré zprávy posuzovat (dny). 4 = denní provoz, víc = úklid fronty"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SPRAVCE_CHAT: ${{ vars.SPRAVCE_CHAT }}
    steps:
      # Současná špička main, ne stav z chvíle, kdy se běh založil.
      #
      # Fronta běhů je seřadí, ale checkout bez tohohle stáhne data z doby
      # PŘED předchozím během. Druhý audit by pak posuzoval kandidáty, které
      # první už odepsal, a push by skončil konfliktem v data/kandidati.json.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Balíčky z mezipaměti
        id: moduly
        uses: actions/cache@v6
        with:
          path: node_modules
          key: moduly-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - if: steps.moduly.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false

      # Zapnutí a volba modelu se přepínají ve Správě, ne tady. Běh si je
      # přečte; když se API neozve, jede se s výchozím nastavením z kódu —
      # výpadek správy nemá zastavit posuzování.
      - name: Nastavení ověřovací vrstvy
        id: ai
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -u
          ZAPNUTO=true
          MODEL=""
          if [ -n "${API_URL:-}" ]; then
            ODPOVED=$(curl -s --max-time 15 "$API_URL/nastaveni-sberu" || true)
            if [ -n "$ODPOVED" ]; then
              ZAPNUTO=$(echo "$ODPOVED" | jq -r '.zapnuto // true')
              MODEL=$(echo "$ODPOVED" | jq -r '.model // empty')
            fi
          fi
          echo "zapnuto=$ZAPNUTO" >> "$GITHUB_OUTPUT"
          echo "ANTHROPIC_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "Ověřovací vrstva: zapnuto=$ZAPNUTO, model=${MODEL:-výchozí z kódu}"

      - name: Ověřovací vrstva je vypnutá
        if: steps.ai.outputs.zapnuto != 'true'
        run: |
          echo "Ve Správě je ověřovací model vypnutý — audit se přeskakuje."

      # Návratový kód se nechává projít dál, aby se k poruše modelu dal
      # poslat srozumitelný signál místo holého „workflow failed".
      - name: Audit fronty
        id: audit
        if: steps.ai.outputs.zapnuto == 'true'
        continue-on-error: true
        env:
          AUDIT_DNI: ${{ inputs.dni || '4' }}
        run: |
          set +e
          npm run audit 2>&1 | tee /tmp/audit.log
          echo "kod=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Ohlásit poruchu ověřovacího modelu
        if: steps.ai.outputs.zapnuto == 'true' && (steps.audit.outputs.kod == '3' || steps.audit.outputs.kod == '4')
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$SPRAVCE_CHAT" ]; then
            echo "Není kam hlásit (chybí TELEGRAM_BOT_TOKEN nebo SPRAVCE_CHAT)."
            exit 0
          fi
          if [ "${{ steps.audit.outputs.kod }}" = "3" ]; then
            DUVOD="Není nastavený klíč k modelu (ANTHROPIC_API_KEY)."
          else
            DUVOD="Model je nastavený, ale volání nevrátilo výsledek. Může být vyčerpaný kredit nebo výpadek služby."
          fi
          TEXT="<b>Ověřovací model neběží</b>%0A%0A${DUVOD}%0A%0ASběr dat běží dál, ale zachycené zprávy nikdo netřídí a návrhy záznamů nevznikají. Web tím nespadne, jen přestane přibývat.%0A%0AKontrola: Actions → Denní audit fronty"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${SPRAVCE_CHAT}" -d "parse_mode=HTML" -d "text=${TEXT}" -o /dev/null
          echo "Porucha ohlášena správci."

      - name: Uložit návrhy a zprávu z auditu
        if: steps.ai.outputs.zapnuto == 'true'
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Audit nic nezměnil."
            exit 0
          fi
          git config user.name "audit"
          git config user.email "audit@users.noreply.github.com"
          git add data/
          git commit -m "Audit fronty $(date -u +'%Y-%m-%d %H:%M UTC')"
          if git push; then exit 0; fi

          # Mezitím zapsal někdo jiný. Rebase tu nepomůže — dva zápisy do
          # týchž polí v JSONu se sloučit nedají. Výsledek auditu se zahodí;
          # posoudí se znovu při dalším běhu nad čerstvými daty.
          echo "Push odmítnut, výsledek tohoto běhu se zahazuje."
          git reset --hard origin/main
          exit 1

      # Porucha modelu se ohlásila výše; teprve teď se má běh obarvit červeně,
      # aby to nezůstalo jen v Telegramu.
      - name: Skončit chybou, když model neběžel
        if: steps.ai.outputs.zapnuto == 'true' && steps.audit.outputs.kod != '0'
        run: |
          echo "Audit skončil kódem ${{ steps.audit.outputs.kod }}."
          exit 1
