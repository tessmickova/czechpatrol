name: Hodinový sběr dat

on:
  schedule:
    # ZÁLOŽNÍ plánovač, a od 18. 9. 2026 řídký. Hlavní je Cloudflare Worker
    # czechpatrol-api, který sem kope každou půlhodinu (api/src/sber.ts).
    # Plánovač GitHubu je „best effort": při zátěži se zpožďuje a část běhů
    # zahodí úplně, proto sám o sobě nestačí.
    #
    # Dřív tu stálo "7,37 * * * *", tedy dvakrát za hodinu. Spolu s workerem
    # to dělalo kolem 96 běhů denně. Repozitář je soukromý a tam se každý běh
    # účtuje z měsíčního přídělu minut, navíc zaokrouhlený nahoru na celou
    # minutu. Příděl došel 17. 9. 2026 v 08:03 a od té chvíle neběželo nic:
    # web se nesestavoval, do kanálů nic neodešlo, a nikdo se to nedozvěděl.
    # Dva plánovače na tutéž práci stály dvojnásobek a přinesly málo.
    #
    # Zůstává jako záchrana pro případ, že workeru vyprší token nebo vypadne
    # Cloudflare. Že sběr stojí, hlásí hlídač v api/src/hlidac.ts — ten běží
    # na Cloudflare, takže výpadek GitHubu přežije a umí o něm říct.
    #
    # Po třech hodinách, ne po šesti (20. 9. 2026). Hlavní plánovač je
    # hodinový, takže záloha po šesti hodinách znamenala, že výpadek workeru
    # stáhne čerstvost webu šestinásobně. Hodinová záloha by ale běžela
    # souběžně s workerem pořád a v soukromém repozitáři se každý běh účtuje
    # z měsíčního přídělu minut — a ten už jednou došel (17. 9. v 08:03,
    # kdy přestalo běžet všechno). Tři hodiny jsou kompromis, který se
    # do přídělu vejde.
    - cron: "17 */3 * * *"
  # Tudy chodí kopnutí z workeru.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sber
  cancel-in-progress: false

jobs:
  sber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Hotové node_modules z mezipaměti, ne instalace pokaždé znovu.
      #
      # `cache: npm` výš schovává jen stažené balíčky, `npm ci` je i tak
      # pokaždé rozbaluje — a to byla většina z těch sta sekund, které běh
      # trval. V soukromém repozitáři se každý běh účtuje zaokrouhlený
      # nahoru na celou minutu, takže zkrátit běh pod minutu znamená
      # zaplatit polovinu.
      - name: Balíčky z mezipaměti
        id: moduly
        uses: actions/cache@v6
        with:
          path: node_modules
          key: moduly-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - if: steps.moduly.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false

      # Bez klíče k modelu, schválně. Kredit došel 20. 9. 2026 a projekt na
      # placené volání nemá; sběr běží podle klíčových slov a posuzování
      # dělá externí ověřovatel Patrol, kterému se neúčtuje.
      #
      # Co tím sběr ztrácí: model vyřazoval nerelevantní zprávy, překládal
      # titulky a dával druhé čtení odmítnutým. Do fronty proto chodí víc
      # šumu — a to je viditelná cena, ne skrytá porucha.
      - name: Sběr z veřejných zdrojů
        run: npm run sber

      - name: Nahrát změny dat
        id: zmena
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Data se nezměnila, není co commitnout."
            echo "zmena=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "sber"
          git config user.email "sber@users.noreply.github.com"
          git add data/
          git commit -m "Sběr dat $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git push && break
            echo "Push selhal, opakuji za $((2**i)) s"
            sleep $((2**i))
            git pull --rebase
          done
          echo "zmena=true" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Naléhavý signál musí odejít hned, ne za den.
      #
      # Vyhlášení mobilizace, krizové vysílání, článek 4 nebo 5 NATO,
      # mimořádný právní stav a uzavření hranic se posílají neověřené
      # a zřetelně označené — u takové zprávy je zpoždění horší než
      # nejistota.
      #
      # Dřív odcházely až s denním souhrnem v 17:00 UTC, nebo když někdo
      # schválil záznam. Rozhlas se totiž spouští změnou data/incidenty.json,
      # jenže sběr mění data/kandidati.json — a navíc push z workflow žádný
      # další workflow nespustí. Signál tak mohl čekat skoro celý den.
      - name: Naléhavé signály do kanálu
        if: steps.zmena.outputs.zmena == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL: ${{ vars.TELEGRAM_KANAL || '@czechpatrol' }}
          SPRAVCE_CHAT: ${{ vars.SPRAVCE_CHAT }}
        run: |
          node nastroje/rozhlas.mjs --okamzite

          # Co odešlo, se musí zapsat zpátky, jinak to příště odejde znovu.
          if [ -z "$(git status --porcelain data/fronta/rozhlaseno.json)" ]; then
            echo "Nic nového k rozeslání."
            exit 0
          fi
          git add data/fronta/rozhlaseno.json
          git commit -m "Rozhlas: stav odeslaných zpráv"
          for i in 1 2 3 4; do
            git push && break
            sleep $((2**i))
            git pull --rebase
          done

      # ---------------------------------------------------------------
      # Nasazení rovnou tady, a jen když se data opravdu změnila.
      #
      # Dřív po každém sběru nastartovalo samostatné Nasazení, zjistilo,
      # že není co nasazovat, a skončilo. Jenže spuštěná úloha se účtuje,
      # i když nic neudělá — a hned po ní se rozjela ještě třetí (Stav pro
      # routines). Z jednoho sběru byly tři úlohy a nejméně čtyři minuty,
      # i ve chvíli, kdy se za tu hodinu nic nestalo. Při sběru po
      # půlhodinách to dělalo skoro trojnásobek měsíčního přídělu.
      #
      # Commit dat je hotový a nahraný dřív, než se začne nasazovat.
      # I kdyby nasazení spadlo, data zůstanou v repozitáři.
      # ---------------------------------------------------------------
      - name: Kontrola dat
        if: steps.zmena.outputs.zmena == 'true'
        run: npm run kontrola:data

      - name: Testy
        if: steps.zmena.outputs.zmena == 'true'
        run: npm test

      - name: Sestavení
        if: steps.zmena.outputs.zmena == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}

      - name: Nasazení na Cloudflare Pages
        if: steps.zmena.outputs.zmena == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=czechpatrol --branch=main --commit-dirty=true
