# API CzechPatrol — účty, upozornění, partner IZS.
#
# Běží odděleně od webu: web je statický na Pages, tohle je Worker s D1.
# Web s ním mluví jen přes HTTPS s tokenem; nic jiného mezi nimi není.
name = "czechpatrol-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
# Odkud smí web volat API (CORS) a pro který doménový název platí passkeye.
PUVOD_WEBU = "https://czechpatrol.cz"
RP_ID = "czechpatrol.cz"
# Předchozí adresy webu během přechodu na vlastní doménu, oddělené čárkou.
# Passkey platí jen pro doménu, na které vznikl; dokud je tu stará adresa,
# lidé se z ní dál přihlásí a web na ní dál smí volat API. Až přejdou,
# vyprázdnit. Postup: docs/PROVOZ.md, část Doména.
PUVOD_WEBU_DALSI = "https://czechpatrol.pages.dev"
NAZEV_WEBU = "CzechPatrol"
# Odkud API čte stav webu (generuje se při buildu webu).
STAV_URL = "https://czechpatrol.cz/stav.json"
# Do kterého repozitáře se kope kvůli sběru dat a který workflow se spouští.
SBER_REPO = "tessmickova/czechpatrol"
SBER_WORKFLOW = "sber.yml"

# Tajemství se nastavují přes `wrangler secret put`, nikdy sem:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ADMIN_BOOTSTRAP_KOD,
#   WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, GH_TOKEN_SBER

[[d1_databases]]
binding = "DB"
database_name = "czechpatrol"
# Doplní workflow nasazení podle skutečné databáze v účtu.
database_id = "__D1_ID__"
migrations_dir = "migrace"

[triggers]
# Každých 10 minut: přečíst stav webu, poslat, co je splatné, a v každém
# druhém tiku (v :00 a :30) kopnout do sběru dat na GitHubu. Plánovač GitHubu
# naplánované běhy zahazuje, tenhle ne — podrobně v src/sber.ts.
crons = ["*/10 * * * *"]
